<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Hospital Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:#0b1d35; --navy-lit:#1a4a82; --gold:#c8922a; --gold-lit:#e8b04a;
      --paper:#f4f2ed; --white:#fff; --ink:#111827; --muted:#9ca3af;
      --border:#e2ddd6; --red:#991b1b; --red-bg:#fee2e2;
      --green:#166534; --green-bg:#dcfce7; --blue:#1e40af; --blue-bg:#dbeafe;
      --shadow-lg:0 12px 36px rgba(0,0,0,.14); --r:8px; --r-lg:14px;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'DM Sans',sans-serif; background:var(--navy);
           min-height:100vh; display:flex; align-items:center; justify-content:center;
           background-image: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200,146,42,.12) 0%, transparent 70%); }
    .shell { width:100%; max-width:420px; padding:1rem; animation:up .35s ease both; }
    @keyframes up { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    .card { background:var(--white); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); overflow:hidden; }
    .head { background:linear-gradient(135deg, #0b1d35 0%, #1a4a82 100%);
            padding:2rem; text-align:center; }
    .head .icon { font-size:2.6rem; display:block; margin-bottom:.4rem; }
    .head h1 { font-family:'Syne',sans-serif; font-size:1.35rem; color:#fff; margin-bottom:.2rem; }
    .head p  { font-size:.82rem; color:rgba(255,255,255,.6); }
    .body { padding:1.8rem; }
    .fg { margin-bottom:1rem; }
    .fg label { display:block; font-size:.73rem; font-weight:600; color:#374151;
                margin-bottom:.28rem; text-transform:uppercase; letter-spacing:.05em; }
    .fg input { width:100%; padding:.62rem .9rem; border:1.5px solid var(--border);
                border-radius:var(--r); font-size:.93rem; font-family:'DM Sans',sans-serif;
                outline:none; transition:border-color .18s, box-shadow .18s; }
    .fg input:focus { border-color:var(--navy-lit); box-shadow:0 0 0 3px rgba(26,74,130,.10); }
    .btn { width:100%; padding:.8rem; border:none; border-radius:var(--r);
           background:var(--navy); color:#fff; font-family:'Syne',sans-serif;
           font-weight:700; font-size:.95rem; cursor:pointer;
           transition:background .18s; margin-top:.5rem; }
    .btn:hover { background:var(--navy-lit); }
    .foot { text-align:center; padding:1rem 1.8rem; border-top:1px solid var(--border);
            font-size:.85rem; color:#6b7280; background:#fafaf8; }
    .foot a { color:var(--navy-lit); font-weight:600; }
    .flashes { list-style:none; margin-bottom:.8rem; }
    .flashes li { padding:.6rem .9rem; border-radius:var(--r); font-size:.84rem;
                  border-left:4px solid transparent; margin-bottom:.3rem; }
    .flashes .danger  { background:var(--red-bg);   border-color:#dc2626; color:var(--red); }
    .flashes .success { background:var(--green-bg); border-color:#16a34a; color:var(--green); }
    .flashes .info    { background:var(--blue-bg);  border-color:#3b82f6; color:var(--blue); }
    .flashes .warning { background:#fef3c7; border-color:#d97706; color:#92400e; }
  </style>
</head>
<body>
<div class="shell">
  <div class="card">
    <div class="head">
      <span class="icon">🏥</span>
      <h1>Hospital Management</h1>
      <p>Sign in to your staff account</p>
    </div>
    <div class="body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="flashes">
            {% for cat, msg in messages %}<li class="{{ cat }}">{{ msg }}</li>{% endfor %}
          </ul>
        {% endif %}
      {% endwith %}
      <form method="post" novalidate>
        <div class="fg">
          <label>Email Address</label>
          <input type="email" name="email" placeholder="staff@hospital.ng" required autofocus/>
        </div>
        <div class="fg">
          <label>Password</label>
          <input type="password" name="password" placeholder="Your password" required/>
        </div>
        <button type="submit" class="btn">Login &rarr;</button>
      </form>
    </div>
    <div class="foot">
      No account? <a href="/signup">Create one</a>
    </div>
  </div>
</div>
</body>
</html>
